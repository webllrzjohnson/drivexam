<title id="title">Bicycle route sign</title><desc id="desc">Original drivexam SVG recreation inspired by the official Ontario handbook: This road is an official bicycle route; watch for cyclists and share the road.</desc><rect width="256" height="256" fill="#f8fafc"/><rect x="38" y="52" width="180" height="128" rx="8" fill="white" stroke="#1f7a3a" stroke-width="8"/><text x="128" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#111">BIKE</text><text x="128" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#111">ROUTE</text><circle cx="96" cy="152" r="14" fill="none" stroke="#111" stroke-width="5"/><circle cx="150" cy="152" r="14" fill="none" stroke="#111" stroke-width="5"/><path d="M96 152l26-38 20 38" stroke="#111" stroke-width="5" fill="none"/></svg>
