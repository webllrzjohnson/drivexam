<title id="title">Yellow traffic light</title><desc id="desc">Original drivexam SVG recreation inspired by the official Ontario handbook: A yellow or amber light means red is about to appear; stop if you can do so safely, otherwise proceed with caution.</desc><rect width="256" height="256" fill="#f8fafc"/><rect x="88" y="30" width="80" height="196" rx="24" fill="#1f2937" stroke="#111" stroke-width="6"/><circle cx="128" cy="72" r="24" fill="#374151" stroke="#111" stroke-width="3"/><circle cx="128" cy="128" r="24" fill="#ffd43b" stroke="#111" stroke-width="3"/><circle cx="128" cy="184" r="24" fill="#374151" stroke="#111" stroke-width="3"/></svg>
