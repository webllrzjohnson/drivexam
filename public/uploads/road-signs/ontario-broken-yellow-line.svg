<title id="title">Broken yellow line</title><desc id="desc">Original drivexam SVG recreation inspired by the official Ontario handbook: A broken yellow line at the left of your lane means you may pass only if the way is clear and there is enough distance.</desc><rect width="256" height="256" fill="#f8fafc"/><rect x="44" y="18" width="168" height="220" rx="10" fill="#3f3f46"/><line x1="128" y1="30" x2="128" y2="52" stroke="#facc15" stroke-width="14" stroke-linecap="round"/><line x1="128" y1="74" x2="128" y2="96" stroke="#facc15" stroke-width="14" stroke-linecap="round"/><line x1="128" y1="118" x2="128" y2="140" stroke="#facc15" stroke-width="14" stroke-linecap="round"/><line x1="128" y1="162" x2="128" y2="184" stroke="#facc15" stroke-width="14" stroke-linecap="round"/><line x1="128" y1="206" x2="128" y2="228" stroke="#facc15" stroke-width="14" stroke-linecap="round"/><text x="128" y="246" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">PASS IF CLEAR</text></svg>
