<title id="title">Flashing red light</title><desc id="desc">Original drivexam SVG recreation inspired by the official Ontario handbook: A flashing red light means stop completely, yield, and proceed only when safe, like a stop sign.</desc><rect width="256" height="256" fill="#f8fafc"/><rect x="88" y="30" width="80" height="196" rx="24" fill="#1f2937" stroke="#111" stroke-width="6"/><circle cx="128" cy="72" r="24" fill="#d71920" stroke="#111" stroke-width="3"/><circle cx="128" cy="128" r="24" fill="#374151" stroke="#111" stroke-width="3"/><circle cx="128" cy="184" r="24" fill="#374151" stroke="#111" stroke-width="3"/><path d="M54 64l-28-22M202 64l28-22M54 192l-28 22M202 192l28 22" stroke="#d71920" stroke-width="10" stroke-linecap="round"/></svg>
