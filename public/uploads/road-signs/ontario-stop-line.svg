<title id="title">Stop line marking</title><desc id="desc">Original drivexam SVG recreation inspired by the official Ontario handbook: A stop line is a single white line across the road showing where drivers must stop at an intersection.</desc><rect width="256" height="256" fill="#f8fafc"/><rect x="44" y="18" width="168" height="220" rx="10" fill="#3f3f46"/><line x1="58" y1="156" x2="198" y2="156" stroke="white" stroke-width="18"/><text x="128" y="135" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="white">STOP</text></svg>
